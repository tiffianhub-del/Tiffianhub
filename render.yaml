services:
  # Backend Service
  - type: web
    name: tiffianhub-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false  # Set this in Render dashboard
      - key: JWT_SECRET
        sync: false  # Set this in Render dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: FRONTEND_URL
        sync: false  # Will be your frontend URL
      - key: RESEND_API_KEY
        sync: false  # Resend API key for email sending
      - key: RESEND_FROM_EMAIL
        sync: false  # Optional: Use verified domain email (e.g., noreply@yourdomain.com)
                     # If not set or uses unverifiable domain (gmail.com, etc.), defaults to onboarding@resend.dev

  # Frontend Service
  - type: web
    name: tiffianhub-frontend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false  # Will be your backend URL

